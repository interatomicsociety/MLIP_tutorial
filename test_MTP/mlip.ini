mtp-filename       ../pot/pot.mtp          #molecular dynamics will be run with MTP written in the file curr.mtp
calculate-efs      TRUE              #energies and forces will be calculated for each step
select             TRUE              #selection mode is activated
                   select:threshold                   2        #the configurations with the grades greater than 2 will be added to the preselected
